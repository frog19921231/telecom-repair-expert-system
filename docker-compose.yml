version: '3.8'

services:
  neo4j:
    image: neo4j:5-community
    container_name: neo4j-repair
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/repair2026
      - NEO4J_server_memory_heap_max__size=4G
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
